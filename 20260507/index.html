<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租屋看房檢查表</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header-image">
        <img src="content_20210302104224_0.jpg" alt="房子" width="700">
    </div>
    <div class="container">
        <h1>租屋看房檢查表</h1>
        <form action="success.html" method="get">
            <section>
                <h2>基本資訊</h2>
                <label>房屋地址：<input type="text" name="address" required></label>
                <label>租金：
                    <select name="rent" required>
                        <option value="">請選擇</option>
                        <option value="5000以下">5000以下</option>
                        <option value="5000-10000">5000 - 10000</option>
                        <option value="10000-15000">10000 - 15000</option>
                        <option value="15000以上">15000以上</option>
                    </select>
                </label>
                <label>房型：
                    <select name="house" required>
                        <option value="">請選擇</option>
                        <option value="套房">套房</option>
                        <option value="雅房">雅房</option>
                    </select>
            </section>
            <section>
                <h2>聯絡資訊</h2>
                <label>姓名：<input type="text" name="address" required></label>
                <label>電話：<input type="text" name="address" required></label>
                <label>電子郵件：<input type="text" name="address" required placeholder="sample@gmail.com"></label>
            </section>
            <section>
                <h2>環境檢查</h2>
                <label><input type="checkbox" name="light"> 採光良好</label>
                <label><input type="checkbox" name="noise"> 安靜無噪音</label>
                <label><input type="checkbox" name="security"> 社區安全</label>
            </section>

            <section>
                <h2>設備檢查</h2>
                <label><input type="checkbox" name="water"> 水壓正常</label>
                <label><input type="checkbox" name="electric"> 電力穩定</label>
                <label><input type="checkbox" name="wifi"> 網路可用</label>
                <label><input type="checkbox" name="furniture"> 家具齊全</label>
            </section>

            <section>
                <h2>備註</h2>
                <textarea name="notes" rows="4" placeholder="其他觀察或疑問"></textarea>
            </section>

            <button type="submit">提交</button>
        </form>
    </div>
</body>

</html>
